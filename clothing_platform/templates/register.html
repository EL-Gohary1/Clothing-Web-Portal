<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Lila Cloth</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <nav class="navbar">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Lila Cloth Logo" />
    </div>
  </nav>

  <main class="register-page">
    <h1 class="page-heading">Welcome to our clothing website !</h1>

    <section class="register-wrapper">
      <div class="register-card">
        <form id="registerForm" method="Post" novalidate>
          <div class="form-group">
            <div class="form-row">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" class="username-input" placeholder="Enter your username" required />
            </div>
            <p id="usernameError" class="field-error"></p>
          </div>

          <div class="form-group">
            <div class="form-row">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" class="email-input" placeholder="Enter your email" required />
            </div>
            <p id="emailError" class="field-error"></p>
          </div>

          <div class="form-group">
            <div class="form-row">
              <label for="password">Password</label>
              <div class="password-box">
                <input type="password" id="password" name="password" class="password-input" placeholder="Enter your password" required />
                <button type="button" class="toggle-password" onclick="togglePassword('password', this)" aria-label="Show or hide password">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.03 2.94"></path>
                    <path d="M6.61 6.61C3.91 8.45 2 12 2 12s3.5 7 10 7a9.77 9.77 0 0 0 5.39-1.61"></path>
                  </svg>
                </button>
              </div>
            </div>
            <p id="passwordError" class="field-error"></p>
          </div>

          <div class="form-group">
            <div class="form-row">
              <label for="confirmPassword">Confirm password</label>
              <div class="password-box">
                <input type="password" id="confirmPassword" name="confirmPassword" class="confirm-password-input" placeholder="Confirm your password" required />
                <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)" aria-label="Show or hide confirm password">
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.03 2.94"></path>
                    <path d="M6.61 6.61C3.91 8.45 2 12 2 12s3.5 7 10 7a9.77 9.77 0 0 0 5.39-1.61"></path>
                  </svg>
                </button>
              </div>
            </div>
            <p id="confirmPasswordError" class="field-error"></p>
          </div>

          <div class="role-section">
            <p class="role-title">Role</p>

            <div class="role-options">
              <label class="role-choice">
                <input type="radio" name="role" value="customer" />
                <span>Customer</span>
              </label>

              <label class="role-choice">
                <input type="radio" name="role" value="supplier" />
                <span>Supplier</span>
              </label>
            </div>

            <p id="roleError" class="role-error"></p>
          </div>

          <p class="login-text">
            Do you have account ?
            <a onclick="window.location.href = '/auth/login'">Login</a>
          </p>

          <div class="submit-wrapper">
            <button type="submit" class="submit-btn">submit</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

  <script>
    const eyeOpenIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  `;

    const eyeOffIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
      <path d="M3 3l18 18"></path>
      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
      <path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.03 2.94"></path>
      <path d="M6.61 6.61C3.91 8.45 2 12 2 12s3.5 7 10 7a9.77 9.77 0 0 0 5.39-1.61"></path>
    </svg>
  `;

    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const registerForm = document.getElementById("registerForm");

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        button.innerHTML = eyeOpenIcon;
      } else {
        input.type = "password";
        button.innerHTML = eyeOffIcon;
      }
    }

    function setError(input, errorId, message) {
      document.getElementById(errorId).textContent = message;
      if (input) {
        input.classList.add("input-error");
      }
    }

    function clearError(input, errorId) {
      document.getElementById(errorId).textContent = "";
      if (input) {
        input.classList.remove("input-error");
      }
    }

    function clearAllErrors() {
      clearError(usernameInput, "usernameError");
      clearError(emailInput, "emailError");
      clearError(passwordInput, "passwordError");
      clearError(confirmPasswordInput, "confirmPasswordError");
      document.getElementById("roleError").textContent = "";
    }

    function validateUsername() {
      const username = usernameInput.value.trim();

      if (username === "") {
        setError(usernameInput, "usernameError", "Username is required");
        return false;
      }

      if (username.length < 3 || username.length > 50) {
        setError(usernameInput,"usernameError", "Username must be 3-50 characters");
        return false;
      }

      clearError(usernameInput, "usernameError");
      return true;
    }

    function validateEmail() {
      const email = emailInput.value.trim().toLowerCase();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (email === "") {
        setError(emailInput, "emailError", "Email is required");
        return false;
      }

      if (!emailPattern.test(email)) {
        setError(emailInput, "emailError", "Invalid Email format.");
        return false;
      }

      clearError(emailInput, "emailError");
      return true;
    }

    function validatePassword() {
      const password = passwordInput.value.trim();

      if (password === "") {
        setError(passwordInput, "passwordError", "Password is required");
        return false;
      }

      if (password.length < 8 || password.length > 64) {
        setError(passwordInput,"passwordError","Password must be 8-64 characters");
        return false;
      }

      clearError(passwordInput, "passwordError");
      return true;
    }

    function validateConfirmPassword() {
      const password = passwordInput.value.trim();
      const confirmPassword = confirmPasswordInput.value.trim();

      if (confirmPassword === "") {
        setError(confirmPasswordInput,"confirmPasswordError","Confirm Password is required");
        return false;
      }

      if (password !== confirmPassword) {
        setError(
          confirmPasswordInput,
          "confirmPasswordError",
          "Password and Confirm Password do not match",
        );
        return false;
      }

      clearError(confirmPasswordInput, "confirmPasswordError");
      return true;
    }

    function validateRole() {
      const selectedRole = document.querySelector('input[name="role"]:checked');

      if (!selectedRole) {
        document.getElementById("roleError").textContent =  "Please select a role";
        return false;
      }

      document.getElementById("roleError").textContent = "";
      return true;
    }

    registerForm.addEventListener("submit", async function (e) {
      // Prevent the default form submission behavior
      e.preventDefault();

      clearAllErrors();

      const isUsernameValid = validateUsername();
      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();
      const isConfirmPasswordValid = validateConfirmPassword();
      const isRoleValid = validateRole();

      if (!isUsernameValid || !isEmailValid || !isPasswordValid || !isConfirmPasswordValid || !isRoleValid) {
        return;
      }

      const newUser = {
        name: usernameInput.value.trim(),
        email: emailInput.value.trim().toLowerCase(),
        password: passwordInput.value.trim(),
        role: document.querySelector('input[name="role"]:checked').value.toUpperCase(),
      };

      try {
        const response = await fetch("/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(newUser),
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = "/auth/login";
        } else {
          alert(data.error);
        }
      } catch (error) {
        console.error("Error during registration:", error);
      }
    });
  </script>
</body>

</html>
