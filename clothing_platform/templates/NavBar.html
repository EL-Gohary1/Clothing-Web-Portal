<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --primary-pink: #ff8eb2;
        --primary-purple: #c29fff;
        --primary-blue: #8edfff;
        --text-dark: #4a4a4a;
        --nav-height: 80px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: var(--nav-height);
        padding: 0 5%;
        background-color: white;
        border-bottom: 3px solid;
        border-image: linear-gradient(
            to right,
            var(--primary-pink),
            var(--primary-purple),
            var(--primary-blue)
          )
          1;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .logo img {
        height: 60px;
        display: block;
        width: auto;
      }
      .nav-links {
        display: flex;
        gap: 20px;
        list-style: none;
        align-items: center;
      }
      .nav-links a {
        text-decoration: none;
        font-weight: 500;
        font-size: 1.1rem;
        transition: 0.3s;
        text-transform: capitalize;
        padding: 8px 20px;
        border-radius: 25px;
      }
      .register-btn {
        color: var(--primary-purple) !important;
        border: 1.5px solid var(--primary-purple);
      }
      .register-btn:hover {
        background-color: var(--primary-purple);
        color: white !important;
      }
      .login-btn {
        color: var(--primary-pink) !important;
        border: 1.5px solid var(--primary-pink);
      }
      .login-btn:hover {
        background-color: var(--primary-pink);
        color: white !important;
      }
      @media (max-width: 600px) {
        .navbar {
          padding: 0 15px;
        }
        .logo img {
          height: 45px;
        }
        .nav-links a {
          font-size: 0.85rem;
          padding: 6px 15px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <ul class="nav-links">
        <li>
          <a href="register.html" target="_parent" class="register-btn"
            >register</a
          >
        </li>
        <li>
          <a href="login.html" target="_parent" class="login-btn">login</a>
        </li>
      </ul>
      <div class="logo">
        <img src="Image/Logo.png" alt="Lila Cloth Logo" />
      </div>
    </nav>
  </body>
</html>
