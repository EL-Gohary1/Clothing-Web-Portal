<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lila Cloth - View Products</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="../static/images/Logo.png" alt="Lila Cloth Logo">
        </div>
        <div class="profile-section">
            <div class="welcome-text">
                Welcome, <span class="admin-name">{{user.name}}</span>
            </div>
            <a href="/auth/profile" class="profile-icon">Profile</a>
        </div>
    </nav>

    <div class="actions-bar">
        <div class="dropdown">
            <button class="dropbtn">Actions</button>
            <div class="dropdown-content">
                <a href="/admin-dashboard/add-user">Add user</a>
                <a href="/admin-dashboard/add-product">Add product</a>
            </div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Search products by name...">
        <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div class="main-tabs">
        <a href="/admin-dashboard/customers" class="main-tab">Customers</a>
        <a href="/admin-dashboard/suppliers" class="main-tab">Suppliers</a>
        <a href="/admin-dashboard/products" class="main-tab active">Products</a>
        <a href="/admin-dashboard/orders" class="main-tab">Orders</a>
    </div>

    <div class="sub-tabs">
        <button class="sub-tab active" data-filter="all">All</button>
        <button class="sub-tab" data-filter="APPROVED">Approved</button>
        <button class="sub-tab" data-filter="PENDING">Pending</button>
    </div>

    <div id="noProductMessage">No products found!</div>
    <div class="products-container" id="productsList"></div>
    <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

    <script>
        let products = {{ products | tojson }};
        let currentFilter = "all";
        let currentSearch = "";
        sessionStorage.setItem('lastPage', window.location.href);
           
        function setupTabs() {
            const subTabs = document.querySelectorAll('.sub-tab');
            subTabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    subTabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-filter');
                    renderProducts();
                });
            });
        }

        function renderProducts() {
            const container = document.getElementById('productsList');
            if (!container) return;

            if (products.length === 0) {
                document.getElementById("noProductMessage").style.display = "block";
                return;
            }

            let filtered = products;

            if (currentFilter !== "all") {
                filtered = filtered.filter(p => p.product_status === currentFilter);
            }

            if (currentSearch) {
                filtered = filtered.filter(p => p.product_title.toLowerCase().includes(currentSearch.toLowerCase()));
            }

            if (filtered.length === 0) {
                container.innerHTML = "";
                document.getElementById("noProductMessage").style.display = "block";
                return;
            } else {
                document.getElementById("noProductMessage").style.display = "none";
            }

            container.innerHTML = filtered.map(product => `
                <div class="product-item" data-id="${product.product_id}">
                    <div class="product-photo">
                        <img src="/static/images/${product.photo}" alt="${product.product_title}">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.product_title}</div>
                        <div class="product-details">
                            <strong>Description:</strong> ${product.description}<br>
                            <strong>Price:</strong> ${product.unit_price} EGP<br>
                            <strong>Stock:</strong> ${product.stock_qty}<br>
                            <strong>Supplier Email:</strong> ${product.supplier_email}
                        </div>
                    </div>
                    <div class="product-right">
                        <span class="status-badge ${product.product_status === 'APPROVED' ? 'status-approved' : 'status-pending'}">
                            ${product.product_status}
                        </span>
                        <div class="action-buttons">
                            ${product.product_status === 'PENDING' ? `
                                <button class="approve-btn" onclick="approveProduct(${product.product_id})">Approve</button>
                                <button class="reject-btn" onclick="deleteProduct(${product.product_id})">Reject</button>
                            ` : ''}
                            <button class="delete-icon" onclick="deleteProduct(${product.product_id})">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function approveProduct(id) {
            try {
                const response = await fetch(`/admin-dashboard/products/${id}/approve`, { method: "PATCH" });
                if (response.ok) {
                    const product = products.find(p => p.product_id === id);
                    if (product) product.product_status = "APPROVED";
                    renderProducts();
                }
            } catch (error) { console.error(error); }
        }

        async function deleteProduct(id) {
            try {
                const response = await fetch(`/admin-dashboard/products/${id}`, { method: "DELETE" });
                if (response.ok) {
                    products = products.filter(p => p.product_id !== id);
                    renderProducts();
                }
            } catch (error) { console.error(error); }
        }

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        function performSearch() {
            currentSearch = searchInput.value;
            renderProducts();
        }

        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
        renderProducts();
        setupTabs();

    </script>
</body>
</html>
