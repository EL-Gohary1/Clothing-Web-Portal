<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lila Cloth - Supplier Products</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Lila Cloth Logo">
        </div>
        <div class="profile-section">
            <div class="welcome-text">Welcome, <span class="supplier-name">{{ g.current_user.name if g.current_user else 'Supplier' }}</span></div>
            <a href="/auth/profile" class="profile-icon">Profile</a>
        </div>
    </nav>

    <div class="actions-bar">
        <div></div>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search your products...">
            <button class="search-btn" id="searchBtn">Search</button>
        </div>
        <a href="/supplier-dhashboard/add-product" class="add-product-btn">+ Add Product</a>
    </div>

    <div class="tabs">
        <a href="/supplier-dhashboard/view-products" class="tab active">Products</a>
        <a href="/supplier-dhashboard/view-orders" class="tab">Orders</a>
    </div>

    <div class="sub-tabs">
        <button class="sub-tab active" data-filter="all">All</button>
        <button class="sub-tab" data-filter="APPROVED">Approved</button>
        <button class="sub-tab" data-filter="PENDING">Pending</button>
    </div>

    <div class="products-container" id="productsList"></div>

    <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

    <script>
        const API_BASE = "/supplier-dhashboard";
        let products = [];
        let currentFilter = "all";
        let currentSearch = "";

        async function fetchProducts() {
            try {
                let url = `${API_BASE}/products`;
                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    products = data.products || [];
                    renderProducts();
                }
            } catch (error) { console.error("Error:", error); }
        }

        function renderProducts() {
            const container = document.getElementById('productsList');
            if (!container) return;

            let filtered = products.filter(p =>
                p.product_status !== 'REJECTED' &&
                p.product_title.toLowerCase().includes(currentSearch.toLowerCase())
            );

            if (currentFilter !== "all") {
                filtered = filtered.filter(p => p.product_status === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:#888;">No products found.</div>`;
                return;
            }

            container.innerHTML = filtered.map(product => `
                <div class="product-item">
                    <div class="product-photo">
                        <img src="/static/images/${product.photo}" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.product_title}</div>
                        <div class="product-details">
                            <strong>Description:</strong> ${product.description || 'No description available.'}<br>
                            <strong>Price:</strong> ${product.unit_price} EGP<br>
                            <strong>Stock:</strong> ${product.stock_qty} units
                        </div>
                    </div>
                    <div class="product-right">
                        <span class="status-badge ${product.product_status === 'APPROVED' ? 'status-approved' : 'status-pending'}">
                            ${product.product_status}
                        </span>
                        <button class="delete-icon" onclick="deleteProduct(${product.product_id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteProduct(id) {
            if(!confirm("Are you sure?")) return;
            try {
                const response = await fetch(`${API_BASE}/products/${id}`, { method: "DELETE" });
                if (response.ok) {
                    products = products.filter(p => p.product_id !== id);
                    renderProducts();
                }
            } catch (error) { console.error(error); }
        }

        document.getElementById('searchBtn').onclick = () => {
            currentSearch = document.getElementById('searchInput').value;
            renderProducts();
        };

        document.querySelectorAll('.sub-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                renderProducts();
            });
        });

        fetchProducts();
    </script>
</body>
</html>
