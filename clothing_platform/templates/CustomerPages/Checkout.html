<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Css/Global.css" />

    <title>Checkout | Lila Cloth</title>
    <style>
      /* Iframe Styles */
      .nav-frame {
        width: 100%;
        height: 85px;
        border: none;
        position: sticky;
        top: 0;
        z-index: 1000;
        background: white;
      }

      .footer-frame {
        width: 100%;
        height: 320px; /* Adjust based on content */
        border: none;
        margin-top: auto;
      }

      /* Checkout Container */
      .main-content {
        flex: 1;
        padding: 40px 5%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .checkout-outer-card {
        width: 100%;
        max-width: 900px;
        background: white;
        border: 2px solid #e0e0e0;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.02);
      }

      .checkout-header {
        text-align: center;
        font-size: 1.5rem;
        color: var(--text-dark);
        margin-bottom: 20px;
        font-weight: 500;
      }

      /* Inner Form Box */
      .checkout-inner-box {
        border: 1.5px solid #eee;
        border-radius: 15px;
        padding: 40px;
        background-color: #fff;
      }

      /* Form Layout */
      .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        justify-content: center;
      }

      .form-group label {
        width: 150px;
        text-align: right;
        margin-right: 20px;
        color: var(--text-dark);
        font-size: 1.1rem;
      }

      .form-group input {
        flex: 1;
        max-width: 450px;
        padding: 12px 20px;
        border: 2px solid var(--primary-blue);
        border-radius: 50px; /* Matching your search bar style */
        outline: none;
        font-size: 1rem;
        transition: 0.3s;
      }

      .form-group input:focus {
        border-color: var(--primary-purple);
        box-shadow: 0 0 8px rgba(194, 159, 255, 0.2);
      }

      /* Payment Method Bar */
      .payment-bar {
        width: 100%;
        padding: 15px 25px;
        border: 1.5px solid #eee;
        border-radius: 12px;
        margin: 30px 0;
        color: var(--text-dark);
        font-size: 1rem;
        background-color: #fafafa;
      }

      /* Action Buttons */
      .action-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
      }

      .back-link {
        text-decoration: none;
        color: var(--text-dark);
        padding: 10px 20px;
        border: 1.5px solid #ccc;
        border-radius: 12px;
        font-weight: 500;
        transition: 0.3s;
      }

      .back-link:hover {
        border-color: var(--primary-blue);
        color: var(--primary-blue);
      }

      .confirm-btn {
        background: linear-gradient(
          to right,
          var(--primary-pink),
          var(--primary-purple)
        );
        color: black;
        border: none;
        padding: 15px 35px;
        border-radius: 12px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 4px 12px rgba(255, 142, 178, 0.3);
      }

      .confirm-btn:hover {
        transform: translateY(-2px);
        opacity: 0.9;
      }

      /* Responsive */
      @media (max-width: 700px) {
        .form-group {
          flex-direction: column;
          align-items: flex-start;
        }
        .form-group label {
          text-align: left;
          margin-bottom: 5px;
        }
        .form-group input {
          width: 100%;
          max-width: none;
        }
        .checkout-inner-box {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- REUSABLE NAVBAR -->
    <iframe src="../NavBar.html" class="nav-frame" scrolling="no"></iframe>

    <main class="main-content">
      <div class="checkout-outer-card">
        <h1 class="checkout-header">Checkout Page</h1>

        <div class="checkout-inner-box">
          <!-- Receiver Name -->
          <div class="form-group">
            <label for="name">receiver name</label>
            <input type="text" id="name" placeholder="Full Name" />
          </div>

          <!-- Receiver Phone -->
          <div class="form-group">
            <label for="phone">receiver phone</label>
            <input type="tel" id="phone" placeholder="05x xxxx xxx" />
          </div>

          <!-- City -->
          <div class="form-group">
            <label for="city">city</label>
            <input type="text" id="city" placeholder="Enter your city" />
          </div>

          <!-- Address -->
          <div class="form-group">
            <label for="address">address</label>
            <input
              type="text"
              id="address"
              placeholder="Street name, Building No."
            />
          </div>

          <!-- Payment Method Bar -->
          <div class="payment-bar">
            Payment Method: <strong>cash-on-delivery</strong>
          </div>

          <!-- Footer Buttons -->
          <div class="action-footer">
            <a href="cart.html" class="back-link">Back to cart page</a>
            <button class="confirm-btn">confirm order</button>
          </div>
        </div>
      </div>
    </main>

    <!-- REUSABLE FOOTER -->
    <iframe
      src="../Footer.html"
      id="footer-iframe"
      class="footer-frame"
      scrolling="no"
    ></iframe>
  </body>
</html>
