<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/Global.css" />

    <title>My Profile | Lila Cloth</title>
    <style>
      /* Iframe Styles */
      .nav-frame {
        width: 100%;
        height: 85px;
        border: none;
        position: sticky;
        top: 0;
        z-index: 1000;
        background: white;
      }

      .footer-frame {
        width: 100%;
        height: 320px;
        border: none;
        margin-top: auto;
      }

      .main-content {
        flex: 1;
        padding: 40px 5%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .profile-card {
        width: 100%;
        max-width: 700px;
        background: white;
        border: 2px solid #e0e0e0;
        border-radius: 20px;
        padding: 40px;
        position: relative;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.02);
      }

      .welcome-msg {
        text-align: center;
        font-size: 1.6rem;
        color: var(--text-dark);
        margin-bottom: 40px;
        font-weight: 500;
      }

      .edit-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        padding: 8px 25px;
        border: 1.5px solid var(--primary-purple);
        background: white;
        color: var(--primary-purple);
        border-radius: 10px;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
      }

      .edit-btn:hover {
        background: var(--primary-purple);
        color: white;
      }

      .info-group {
        display: flex;
        align-items: center;
        margin-bottom: 25px;
        justify-content: center;
      }

      .info-group label {
        width: 120px;
        font-size: 1.2rem;
        color: var(--text-dark);
        margin-right: 15px;
        text-transform: lowercase;
      }

      .info-group input {
        flex: 1;
        max-width: 350px;
        padding: 10px 20px;
        border: 2px solid var(--primary-blue);
        border-radius: 12px;
        outline: none;
        font-size: 1rem;
        background-color: #fafafa;
        color: var(--text-dark);
        transition: all 0.3s ease;
      }

      /* Visual style when input is editable */
      .info-group input:not([readonly]) {
        background-color: #ffffff;
        border-color: var(--primary-purple);
        box-shadow: 0 0 8px rgba(128, 0, 128, 0.1);
      }

      .button-footer {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-top: 50px;
      }

      .logout-btn {
        padding: 10px 25px;
        border: 1.5px solid var(--primary-pink);
        background: white;
        color: var(--primary-pink);
        border-radius: 10px;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
      }

      .logout-btn:hover {
        background-color: var(--primary-pink);
        color: white;
      }

      .done-btn {
        padding: 10px 35px;
        border: none;
        background: linear-gradient(
          to right,
          var(--primary-pink),
          var(--primary-purple)
        );
        color: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.2rem;
        font-weight: 500;
        transition: 0.3s;
      }

      .done-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }

      @media (max-width: 600px) {
        .profile-card {
          padding: 20px;
          padding-top: 60px;
        }
        .info-group {
          flex-direction: column;
          align-items: flex-start;
        }
        .info-group label {
          margin-bottom: 5px;
        }
        .info-group input {
          width: 100%;
          max-width: none;
        }
        .edit-btn {
          top: 15px;
          right: 15px;
        }
      }
    </style>
  </head>
  <body>
    <!-- shared NAVBAR -->
    <iframe
      src={{ '/static/customer-nav-bar.html' if user else '/static/nav-bar.html' }}
      class="nav-frame"
      scrolling="no"
    ></iframe>

    <main class="main-content">
      <div class="profile-card">
        <!-- Edit Button -->
        <button class="edit-btn" id="editBtn">Edit</button>

        <h1 class="welcome-msg">welcome to your profile page !</h1>

        <!-- User Name -->
        <div class="info-group">
          <label>User name</label>
          <input type="text" value="{{user.name}}" id="userName" readonly />
        </div>

        <!-- Email -->
        <div class="info-group">
          <label>Email</label>
          <input
            type="email"
            id="userEmail"
            value="{{user.email}}"
            readonly
          />
        </div>

        <div class="button-footer">
          <!-- Logout Button -->
          <button class="logout-btn" id="logoutBtn">Log out</button>
          <!-- Done Button -->
          <button class="done-btn" id="doneBtn">Done</button>
        </div>
      </div>
    </main>

    <!-- shared FOOTER -->
    <iframe
      src="/static/footer.html"
      id="footer-iframe"
      class="footer-frame"
      scrolling="no"
    ></iframe>

    <script>
      const editBtn = document.getElementById("editBtn");
      const doneBtn = document.getElementById("doneBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      const userNameInput = document.getElementById("userName");

      editBtn.addEventListener("click", () => {
        userNameInput.readOnly = false;
        userNameInput.focus();

        editBtn.style.visibility = "hidden";
      });

      doneBtn.addEventListener("click", async () => {
        userNameInput.readOnly = true;
        editBtn.style.visibility = "visible";

        const updatedData = {
          name: userNameInput.value,
        };

        try {
          const res = await fetch("/auth/profile", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(updatedData),
          });

          const data = await res.json();

          if (!res.ok) {
            alert(data.message || "Failed to update profile");
            return;
          }

          alert("Profile updated successfully");
        } catch (err) {
          console.error(err);
          alert("Error updating profile");
        }
      });

      logoutBtn.addEventListener("click", async () => {
        try {
          const res = await fetch("/auth/logout", {
            method: "POST",
          });

          if (res.ok) {
            window.parent.location.href = "/auth/login";
          } else {
            alert("Logout failed");
          }
        } catch (err) {
          console.error(err);
          alert("Error logging out");
        }
      });
    </script>
  </body>
</html>
