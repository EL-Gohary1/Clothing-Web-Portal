<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>My Profile | Lila Cloth</title>
  </head>
  <body>
    <!-- shared NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Lila Cloth Logo">
        </div>
    </nav>

    <main class="main-content">
      <div class="profile-card">
        <!-- Edit Button -->
        <button class="edit-btn" id="editBtn">Edit</button>

        <h1 class="welcome-msg">welcome to your profile page !</h1>

        <!-- User Name -->
        <div class="info-group">
          <label>User name</label>
          <input type="text" value="{{user.name}}" id="userName" readonly />
        </div>

        <!-- Email -->
        <div class="info-group">
          <label>Email</label>
          <input
            type="email"
            id="userEmail"
            value="{{user.email}}"
            readonly
          />
        </div>

        <div class="button-footer">
          <!-- Logout Button -->
          <button class="logout-btn" id="logoutBtn">Log out</button>
          <!-- Done Button -->
          <button class="done-btn" id="doneBtn">Done</button>
        </div>
      </div>
    </main>

    <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

    <script>
      const editBtn = document.getElementById("editBtn");
      const doneBtn = document.getElementById("doneBtn");
      const logoutBtn = document.getElementById("logoutBtn");

      const userNameInput = document.getElementById("userName");

      editBtn.addEventListener("click", () => {
        userNameInput.readOnly = false;
        userNameInput.focus();

        editBtn.style.visibility = "hidden";
      });

      doneBtn.addEventListener("click", async () => {
        userNameInput.readOnly = true;
        editBtn.style.visibility = "visible";

        const updatedData = {
          name: userNameInput.value,
        };

        try {
          const res = await fetch("/auth/profile", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(updatedData),
          });

          const data = await res.json();

          if (!res.ok) {
            console.error(data.message);
            return;
          }
          
          const backTo = sessionStorage.getItem('lastPage') || "/";
          window.top.location.href = backTo;              
        
        } catch (err) {
          console.error(err);
        }
      });

      logoutBtn.addEventListener("click", async () => {
        try {
          const res = await fetch("/auth/logout", {
            method: "POST",
          });

          if (res.ok) {
            window.parent.location.href = "/auth/login";
          } else {
            console.error("Logout failed");
          }
        } catch (err) {
          console.error(err);
        }
      });
    </script>
  </body>
</html>
