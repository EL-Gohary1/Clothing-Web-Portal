<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lila Cloth - Add User</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="../static/images/Logo.png" alt="Lila Cloth Logo" onerror="this.src='https://via.placeholder.com/60?text=Logo'">
        </div>
        <div class="profile-section">
            <div class="welcome-text">
                Welcome, <span class="admin-name">Admin's Name.</span>
            </div>
            <a href="/auth/profile">
                <div class="profile-icon">Profile</div>
            </a>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-card">
            <div class="form-title">Add User</div>
            
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="userName" placeholder="Enter Name">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="userPassword" placeholder="Enter Password">
            </div>

            <div class="form-group" id="emailGroup">
                <label>Email</label>
                <input type="email" id="userEmail" placeholder="Enter Email">
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label>Role</label>
                <div class="radio-group">
                    <label>
                        Customer <input type="radio" name="role" value="Customer">
                    </label>
                    <label>
                        Supplier <input type="radio" name="role" value="Supplier">
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <a href="/admin-dashboard/customers" class="btn-back">Back</a>
                <button class="btn-save" onclick="saveUser()">Save</button>
            </div>
        </div>
    </div>

    <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

    <script>

        function clearEmailError() {
            document.getElementById('userEmail').classList.remove('error-input');
            document.getElementById('emailError').textContent = '';
        }

        async function saveUser() {
            clearEmailError();

            const name = document.getElementById('userName').value.trim();
            const password = document.getElementById('userPassword').value;
            const email = document.getElementById('userEmail').value.trim();
            const role = document.querySelector('input[name="role"]:checked');

            if (!name || !password || !email || !role) {
                alert('Required data');
                return;
            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                document.getElementById('userEmail').classList.add('error-input');
                document.getElementById('emailError').textContent =
                    'Please enter a valid email address';
                return;
            }

            const payload = {
                name: name,
                email: email,
                password: password,
                role: role.value
            };

            try {
                const response = await fetch("/admin-dashboard/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json();
                    alert(err.message || "Error creating user");
                    return;
                }

                // success& redirect
                window.location.href = "/admin-dashboard/customers";

            } catch (error) {
                console.error(error);
                alert("Server error");
            }
        }
    </script>
</body>
</html>
