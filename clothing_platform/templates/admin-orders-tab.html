<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lila Cloth - View Orders</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="../static/images/Logo.png" alt="Lila Cloth Logo" onerror="this.src='https://via.placeholder.com/60?text=Logo'">
        </div>
        <div class="profile-section">
            <div class="welcome-text">
                Welcome, <span class="admin-name">{{user.name}}</span>
            </div>
            <a href="/auth/profile">
                <div class="profile-icon">Profile</div>
            </a>
        </div>
    </nav>

    <div class="actions-bar">
        <div class="dropdown">
            <button class="dropbtn">Actions</button>
            <div class="dropdown-content">
                <a href="/admin-dashboard/add-user">Add user</a>
                <a href="/admin-dashboard/add-product">Add product</a>
            </div>
        </div>
    </div>

    <div class="tabs">
        <a href="/admin-dashboard/customers" class="tab">Customers</a>
        <a href="/admin-dashboard/suppliers" class="tab">Suppliers</a>
        <a href="/admin-dashboard/products" class="tab">Products</a>
        <a href="/admin-dashboard/orders" class="tab active">Orders</a>
    </div>

    <div class="orders-container" id="ordersList"></div>

    <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

    <script>
        let orders = {{ orders | tojson }};
        sessionStorage.setItem('lastPage', window.location.href);

        function renderOrders() {
            const container = document.getElementById('ordersList');
            if (!container) return;

            if (orders.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; background:white; border-radius:12px;">No orders found.</div>`;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-item" data-id="${order.order_id}">
                    <div class="order-info">
                        <div class="order-title">Order ID: ${order.order_id}</div>
                        <div class="order-details">
                            <strong>Customer Email:</strong> ${order.customer_email} <br>

                            <strong>Suppliers Emails:</strong> ${order.supplier_emails.join(', ')} <br>
                            
                            <strong>Receiver:</strong> ${order.receiver_name} <br>
                            <strong>Total:</strong> <span style="font-weight:bold; color:var(--primary-purple);">${order.total_price} EGP</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        renderOrders();
    </script>
</body>
</html>
