<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lila Cloth - Add Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="../static/images/Logo.png" alt="Lila Cloth Logo" onerror="this.src='https://via.placeholder.com/60?text=Logo'">
        </div>
        <div class="profile-section">
            <div class="welcome-text">
                Welcome, <span class="admin-name">Admin's Name.</span>
            </div>
            <a href="/auth/profile">
                <div class="profile-icon">Profile</div>
            </a>
        </div>
    </nav>


    <div class="form-container">
        <div class="form-card">
            <div class="form-title">Add product</div>
            
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="productName" placeholder="Enter product name">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="productDesc" placeholder="Enter product description"></textarea>
            </div>

            <div class="form-group">
                <label>price_unit</label>
                <input type="number" id="productPrice" placeholder="Enter price">
            </div>

            <div class="form-group">
                <label>photo</label>
                <input type="text" id="productPhoto" placeholder="Enter photo URL">
            </div>

            <div class="form-group">
                <label>Quantity of stock</label>
                <input type="number" id="productStock" placeholder="Enter quantity">
            </div>

            <div class="form-group">
                <label>Supplier_ID</label>
                <input type="number" id="supplierId" placeholder="Enter supplier ID">
            </div>

            <div class="form-actions">
                <a href="/admin-dashboard/products" class="btn-back">Back</a>
                <button class="btn-save" id="saveBtn" onclick="saveProduct()">Submit</button>
            </div>
        </div>
    </div>

    <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

    <script>
        const saveBtn = document.getElementById('saveBtn');
        async function saveProduct() {
            const name = document.getElementById('productName').value.trim();
            const desc = document.getElementById('productDesc').value.trim();
            const price = document.getElementById('productPrice').value;
            const photo = document.getElementById('productPhoto').value.trim();
            const stock = document.getElementById('productStock').value;
            const supplierId = document.getElementById('supplierId').value;
            
            
            const data = {
                product_title: name,
                description: desc,
                unit_price: price,
                photo: photo,
                stock_quantity: stock,
                supplier_id: supplierId,
                product_status: "APPROVED"
            };    
    
    
            if (!data.product_title || !data.unit_price || !data.stock_qty || !(data.unit_price > 0) || !(data.stock_qty > 0) || !data.photo || !data.supplier_id) {
                alert('Enter Valid Data');
                return;
            }

            try {
                saveBtn.disabled = true;
                saveBtn.innerText = 'Saving...';
                const response = await fetch("/admin-dashboard/products", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    window.location.href = '/admin-dashboard/products';
                } else {
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Submit';
                }

            } catch (error) {
                console.error(error);
                saveBtn.disabled = false;
                saveBtn.innerText = 'Submit';
            }
        }
    </script>
</body>
</html>
