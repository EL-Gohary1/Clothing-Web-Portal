<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/Global.css" />
    <link rel="stylesheet" href="/static/cart.css" />
    <title>Your Cart | Lila Cloth</title>
    <style>
      /* Adding a few styles for the frames since they weren't in your snippet */
      .nav-frame {
        width: 100%;
        height: 85px;
        border: none;
      }
      .footer-frame {
        width: 100%;
        height: 320px;
        border: none;
        margin-top: 40px;
      }

      .total-display span {
        font-weight: bold;
        color: var(--primary-purple, #6a1b9a);
      }
    </style>
  </head>
  <body>
    <!-- shared navbar -->
    <iframe
      src="/static/nav-bar.html"
      class="nav-frame"
      scrolling="no"
    ></iframe>

    <main class="cart-container">
      <h1>Shopping Cart</h1>

      <div class="cart-item" id="cart-container"></div>

      <div class="cart-summary">
        <div class="total-display">
          Total: <span id="grand-total">0.00 EGP</span>
        </div>
        <button class="checkout-btn" onclick="goToCheckout()">Checkout</button>
      </div>
    </main>

    <!-- shared FOOTER -->
    <iframe
      src="/static/footer.html"
      class="footer-frame"
      scrolling="no"
    ></iframe>

    <script>
            let cart = {{ cart|tojson }};

            console.log("Cart Data:", cart);

            function renderCartItems() {
                const container = document.getElementById("cart-container");

                if (!cart || !cart.items || cart.items.length === 0) {
                    container.innerHTML = "<p>The Cart is Empty</p>";
                    document.getElementById("grand-total").innerText = "0.00 EGP";
                    return;
                }

                container.innerHTML = cart.items.map(item => `
                    <div class="cart-item" id="item-${item.product_id}">

                        <div class="item-left">
                            <div class="photo-box">
                                <img src="/static/images/${item.product_photo}" />
                            </div>

                            <div class="quantity-controls">
                                <button onclick="decreaseQty(${item.product_id})">-</button>

                                <span id="qty-${item.product_id}">
                                    ${item.quantity}
                                </span>

                                <button onclick="increaseQty(${item.product_id})">+</button>

                                <button onclick="removeItem(${item.product_id})">🗑️</button>
                            </div>
                        </div>

                        <div class="item-right">
                            <div class="field item-name">
                                ${item.product_title}
                            </div>

                            <div class="field price-box">
                                Price:
                                <span id="price-${item.product_id}">
                                    ${item.unit_price}
                                </span>
                            </div>

                            <div class="field">
                                Subtotal:
                                <span class="item-subtotal" id="subtotal-${item.product_id}">
                                    ${item.unit_price * item.quantity}
                                </span>
                            </div>

                            <div class="field item-desc">
                                ${item.product_description}
                            </div>
                        </div>

                    </div>
                `).join('');

                updateGrandTotal();
            }
            function updateGrandTotal() {
                let total = 0;

                document.querySelectorAll(".item-subtotal").forEach(el => {
                    total += parseFloat(el.innerText);
                });

                document.getElementById("grand-total").innerText =
                    total.toFixed(2) + " EGP";
            }

            async function increaseQty(productId) {
                const qtyEl = document.getElementById(`qty-${productId}`);
                let newQty = parseInt(qtyEl.innerText) + 1;

                const res = await fetch(`/customer/cart/${productId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ quantity: newQty })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.message);
                    return;
                }

                qtyEl.innerText = newQty;

                const price = parseFloat(
                    document.getElementById(`price-${productId}`).innerText
                );

                document.getElementById(`subtotal-${productId}`).innerText =
                    (price * newQty).toFixed(2);

                updateGrandTotal();
            }
            async function decreaseQty(productId) {
                const qtyEl = document.getElementById(`qty-${productId}`);
                let newQty = parseInt(qtyEl.innerText) - 1;

                if (newQty < 1) return;

                const res = await fetch(`/customer/cart/${productId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ quantity: newQty })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.message);
                    return;
                }

                qtyEl.innerText = newQty;

                const price = parseFloat(
                    document.getElementById(`price-${productId}`).innerText
                );

                document.getElementById(`subtotal-${productId}`).innerText =
                    (price * newQty).toFixed(2);

                updateGrandTotal();
            }

            async function removeItem(productId) {
                if (!confirm("Remove this item?")) return;

                const res = await fetch(`/customer/cart/${productId}`, {
                    method: "DELETE"
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.message);
                    return;
                }

                document.getElementById(`item-${productId}`).remove();

                updateGrandTotal();
            }

            function goToCheckout() {
             window.location.href = "/customer/checkout";
            }
            renderCartItems();
            updateGrandTotal();
    </script>
  </body>
</html>
