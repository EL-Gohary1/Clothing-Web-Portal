<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Lila Cloth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>

  <body>
    <nav class="navbar">
      <div class="logo">
          <img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Lila Cloth Logo" />
      </div>
    </nav>

    <main class="login-page">
      <section class="login-wrapper">
        <div class="login-card">
          <h2>Welcome back!</h2>

          <form id="loginForm" action="/auth/login" method="POST" novalidate>
            <div class="form-group">
              <div class="form-row">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="email-input"
                  placeholder="Enter your email"
                />
              </div>
              <p id="emailError" class="field-error"></p>
            </div>

            <div class="form-group">
              <div class="form-row">
                <label for="password">Password</label>

                <div class="password-box">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="password-input"
                    placeholder="Enter your password"
                  />
                  <button
                    type="button"
                    class="toggle-password"
                    id="togglePasswordBtn"
                    onclick="togglePassword()"
                    aria-label="Show or hide password"
                  >
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                      <path d="M3 3l18 18"></path>
                      <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                      <path
                        d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.03 2.94"
                      ></path>
                      <path
                        d="M6.61 6.61C3.91 8.45 2 12 2 12s3.5 7 10 7a9.77 9.77 0 0 0 5.39-1.61"
                      ></path>
                    </svg>
                  </button>
                </div>
              </div>
              <p id="passwordError" class="field-error"></p>
            </div>

            <p class="signup-text">
              You don't have an account?
              <a href="/auth/register">Sign up here</a>
            </p>
            <div id="loginError" class="error-message">{{ server_error or '' }}</div>

            <div class="submit-wrapper">
              <button type="submit" class="submit-btn">submit</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

    <script>
      const eyeOpenIcon = `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      `;

      const eyeOffIcon = `
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
          <path d="M3 3l18 18"></path>
          <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
          <path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.03 2.94"></path>
          <path d="M6.61 6.61C3.91 8.45 2 12 2 12s3.5 7 10 7a9.77 9.77 0 0 0 5.39-1.61"></path>
        </svg>
      `;

      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginForm = document.getElementById("loginForm");
      const loginError = document.getElementById("loginError");
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");

      

      function togglePassword() {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          togglePasswordBtn.innerHTML = eyeOpenIcon;
        } else {
          passwordInput.type = "password";
          togglePasswordBtn.innerHTML = eyeOffIcon;
        }
      }

      function setError(input, errorId, message) {
        document.getElementById(errorId).textContent = message;
        input.classList.add("input-error");
      }

      function clearError(input, errorId) {
        document.getElementById(errorId).textContent = "";
        input.classList.remove("input-error");
      }

      function clearAllErrors() {
        clearError(emailInput, "emailError");
        clearError(passwordInput, "passwordError");
        loginError.textContent = "";
      }

      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        loginError.textContent = "";

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value.trim();

        if (!email || !password) {
        loginError.textContent = "Email/Password required";
        return
      }
        const formData = {
          email: email,
          password: password,
        };

        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(formData),
          });

          const data = await response.json();

          if (response.ok) {
            const role = data.role || (data.user && data.user.role);

            if (role === "CUSTOMER") {
              window.location.href = "/customer/";
            } else if (role === "ADMIN") {
              window.location.href = "/admin-dashboard/customers";
            } else if (role === "SUPPLIER") {
              window.location.href = "/supplier-dhashboard/view-products";
            } else {
              window.location.href = "/api";
            }
          } else {
            loginError.textContent = data.error || "Login failed";
          }
        } catch (error) {
          console.error(error) ;
        }
      });
    </script>
  </body>
</html>
