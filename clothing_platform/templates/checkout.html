<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <title>Checkout | Lila Cloth</title>
</head>

<body>
  <!-- shared NAVBAR -->
  <iframe src="/customer-navbar" class="nav-frame" scrolling="no" frameborder="0"></iframe>

  <main class="main-content">
    <div class="checkout-outer-card">
      <h1 class="checkout-header">Checkout Page</h1>
      <form onsubmit="confirmOrder(event)">
        <div class="checkout-inner-box">

          <!-- Receiver Name -->
          <div class="form-group">
            <label for="name">receiver name</label>
            <input type="text" id="name" placeholder="Full Name" name="receiver_name" />
          </div>

          <!-- Receiver Phone -->
          <div class="form-group">
            <label for="phone">receiver phone</label>
            <input type="tel" id="phone" placeholder="01063494670" name="receiver_phone" />
          </div>

          <!-- City -->
          <div class="form-group">
            <label for="city">city</label>
            <input type="text" id="city" placeholder="Enter your city" name="delivery_city" />
          </div>

          <!-- Address -->
          <div class="form-group">
            <label for="address">address</label>
            <input type="text" id="address" placeholder="Street name, Building No." name="delivery_address" />
          </div>

          <!-- Email (required for checkout) -->
          <div class="form-group">
            <label for="email">email</label>
            <input type="email" id="email" placeholder="name@example.com" name="email" readonly value="{{ user.email }}" />
          </div>

          <!-- Payment Method  -->
          <div class="payment-bar">
            Payment Method: <strong>cash-on-delivery</strong>
          </div>

          <!-- Buttons -->
          <div class="action-footer">
            <a class="back-link" onclick="returnIntoCart()">Back to cart page</a>
            <button type="submit" class="confirm-btn">confirm order</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <iframe src="/static/footer.html" class="footer-frame" scrolling="no"></iframe>

  <script>
    cart = {{ cart | tojson }}

    sessionStorage.setItem('lastPage', window.location.href);
    
    function returnIntoCart() {
      window.location.href = "/customer/cart";
    }

    async function confirmOrder(event) {
      if (event) event.preventDefault();
      let name = document.getElementById("name").value.trim();
      let phone = document.getElementById("phone").value.trim();
      let city = document.getElementById("city").value.trim();
      let address = document.getElementById("address").value.trim();
      let email = document.getElementById("email").value.trim();

      if (!name || !phone || !city || !address || !email) {
        alert("All fields are required.");
        return false;
      }

      
      const payload = {
        "delivery_address": address,
        "delivery_city": city,
        "receiver_name": name,
        "receiver_phone": phone,
        "email": email
      };

      try {
        const response = await fetch("/customer/checkout", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json();
          console.error(err);
          return;
        }

        window.location.href = "/customer/";

      } catch (error) {
        console.error(error);
      }

    }

  </script>
</body>

</html>
