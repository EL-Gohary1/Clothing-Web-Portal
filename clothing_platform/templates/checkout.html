<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/checkout.css" />
    <link rel="stylesheet" href="/static/Global.css" />
    <title>Checkout | Lila Cloth</title>
  </head>
  <body>
    <!-- shared NAVBAR -->
    <iframe
      src="/static/nav-bar.html"
      class="nav-frame"
      scrolling="no"
    ></iframe>

    <main class="main-content">
      <div class="checkout-outer-card">
        <h1 class="checkout-header">Checkout Page</h1>
        <form method="POST" action="/customer/checkout">
          <div class="checkout-inner-box">
            <div class="form-group">
              <label for="name">receiver name</label>
              <input
                type="text"
                id="name"
                placeholder="Full Name"
                name="receiver_name"
                required
              />
            </div>

            <!-- Receiver Phone -->
            <div class="form-group">
              <label for="phone">receiver phone</label>
              <input
                type="tel"
                id="phone"
                placeholder="05x xxxx xxx"
                name="receiver_phone"
                required
              />
            </div>

            <!-- City -->
            <div class="form-group">
              <label for="city">city</label>
              <input
                type="text"
                id="city"
                placeholder="Enter your city"
                name="delivery_city"
                required
              />
            </div>

            <!-- Address -->
            <div class="form-group">
              <label for="address">address</label>
              <input
                type="text"
                id="address"
                placeholder="Street name, Building No."
                name="delivery_address"
                required
              />
            </div>

            <!-- Email (required for checkout) -->
            <div class="form-group">
              <label for="email">email</label>
              <input
                type="email"
                id="email"
                placeholder="name@example.com"
                name="email"
                value="{{ user.email if user and user.email else '' }}"
                required
              />
            </div>

            <!-- Payment Method  -->
            <div class="payment-bar">
              Payment Method: <strong>cash-on-delivery</strong>
            </div>

            <!-- Buttons -->
            <div class="action-footer">
              <a class="back-link" onclick="returnIntoCart()">
                Back to cart page</a
              >
              <button type="submit" class="confirm-btn">confirm order</button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <!-- shared FOOTER -->
    <iframe
      src="/static/footer.html"
      id="footer-iframe"
      class="footer-frame"
      scrolling="no"
    ></iframe>

    <script>
      cart = {{ cart | tojson }}
      function returnIntoCart() {
        window.location.href = "/customer/cart";
      }
    </script>
  </body>
</html>
