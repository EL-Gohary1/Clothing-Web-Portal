<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lila Cloth - Add Product</title>
    <style>
        :root {
            --primary-pink: #ff8eb2;
            --primary-purple: #c29fff;
            --primary-blue: #8edfff;
            --text-dark: #4a4a4a;
            --bg-light: #fefefe;
            --nav-height: 80px;
        }

        * { margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; box-sizing: border-box; }
        body { background-color: #f5f7fa; min-height: 100vh; display: flex; flex-direction: column; }

        /* Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            height: var(--nav-height); padding: 0 5%; background-color: white;
            border-bottom: 3px solid;
            border-image: linear-gradient(to right, var(--primary-pink), var(--primary-purple), var(--primary-blue)) 1;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .logo img { height: 60px; width: auto; }
        .profile-section { display: flex; align-items: center; gap: 12px; }
        .supplier-name { color: var(--primary-purple); font-weight: bold; }
        .profile-icon {
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
            padding: 8px 18px; border-radius: 30px; font-size: 0.85rem;
            color: white; text-decoration: none; transition: 0.2s;
        }

        .form-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 5%; }
        .form-card {
            background: white; border-radius: 24px; padding: 40px;
            width: 100%; max-width: 550px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); border: 1px solid #eee;
        }
        .form-title { font-size: 1.5rem; font-weight: bold; color: var(--text-dark); margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-dark); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 15px; border: 1px solid #ddd;
            border-radius: 12px; font-size: 0.9rem; outline: none; transition: 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary-purple); }

        .form-actions { display: flex; gap: 15px; margin-top: 30px; }
        .btn-back {
            flex: 1; padding: 12px; background: #f0f0f0; border-radius: 30px;
            color: var(--text-dark); text-align: center; text-decoration: none; font-weight: 500;
        }
        .btn-save {
            flex: 1; padding: 12px; border: none; border-radius: 30px;
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
            color: white; font-size: 1rem; font-weight: 500; cursor: pointer;
        }
        footer { background: white; padding: 30px 5%; text-align: center; border-top: 1px solid #eee; margin-top: auto; }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Lila Cloth Logo">
        </div>
        <div class="profile-section">
            <div class="welcome-text">Welcome, <span class="supplier-name">{{ g.current_user.name if g.current_user else 'Supplier' }}</span></div>
            <a href="/auth/profile" class="profile-icon">Profile</a>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-card">
            <div class="form-title">Add New Product</div>

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="productName" placeholder="e.g. Modern Cotton Shirt">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="productDesc" placeholder="Describe the material, fit, etc."></textarea>
            </div>

            <div class="form-group">
                <label>Unit Price (EGP)</label>
                <input type="number" id="productPrice" placeholder="0.00">
            </div>

            <div class="form-group">
                <label>Photo URL / Filename</label>
                <input type="text" id="productPhoto" placeholder="image_name.jpg">
            </div>

            <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number" id="productStock" placeholder="Amount available">
            </div>

            <div class="form-actions">
                <a href="/supplier-dhashboard/view-products" class="btn-back">Cancel</a>
                <button class="btn-save" id="saveBtn" onclick="saveProduct()">Submit for Review</button>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 Lila Cloth. All Rights Reserved.</footer>

    <script>
        async function saveProduct() {
            const saveBtn = document.getElementById('saveBtn');
            const data = {
                product_title: document.getElementById('productName').value.trim(),
                description: document.getElementById('productDesc').value.trim(),
                unit_price: document.getElementById('productPrice').value,
                photo: document.getElementById('productPhoto').value.trim(),
                stock_qty: document.getElementById('productStock').value
            };

            if (!data.product_title || !data.unit_price || !data.stock_qty) {
                alert('Please fill in the product name, price, and stock quantity.');
                return;
            }

            try {
                saveBtn.disabled = true;
                saveBtn.innerText = 'Saving...';

                const response = await fetch('/supplier-dhashboard/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Product submitted successfully! It is now pending review.');
                    window.location.href = '/supplier-dhashboard/view-products';
                } else {
                    alert('Error: ' + (result.error || 'Failed to save product'));
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'Submit for Review';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection error. Please try again.');
                saveBtn.disabled = false;
                saveBtn.innerText = 'Submit for Review';
            }
        }
    </script>
</body>
</html>
